[package]
name = "cron-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for cron scheduling using Go WASM via Extism"
license = "MIT"

[dependencies]
extism = "1.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
thiserror = "1.0"

[build-dependencies]
copy_dir = "0.1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "cron_benchmarks"
harness = false
